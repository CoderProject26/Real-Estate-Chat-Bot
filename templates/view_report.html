<!DOCTYPE html>
<html>
<head>
    <title>View Report</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            width: 60%;
            margin: auto;
        }

        a {
            display: inline-block;
            margin: 15px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>📄 Report Details</h1>

    <h2>{{ report["name"] }}</h2>

    <p><strong>ID:</strong> {{ report["id"] }}</p>
    <p><strong>Date:</strong> {{ report["date"] }}</p>
    <p><strong>Type:</strong> {{ report["type"] }}</p>
    <p><strong>Description:</strong> {{ report["description"] }}</p>

    <a href="{{ url_for('export_report', report_id=report['id']) }}">
        📄 Download PDF
    </a>

    <a href="{{ url_for('saved_reports') }}">
        ← Back
    </a>
</div>

</body>
</html>
